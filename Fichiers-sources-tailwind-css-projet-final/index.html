<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tailwind CSS</title>
  <!-- CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    .hero-bg {
        background-image: url('https://images.unsplash.com/photo-1580094333632-438bdc04f79f?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
    }
</style>
</head>

<body>


  <!-- ############### -->
  <!-- Navigation -->
  <!-- ############### -->

  <nav class="bg-gray-800 bg-opacity-75 fixed w-full z-10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center">
          <div class="flex-shrink-0">
            <img src="./Logo-02.png" alt="logo" class="h-8 w-8">
          </div>
          <div class="hidden md:block">
            <div class="ml-10 flex items-baseline space-x-4">
              <a href="#" class="text-gray-300 hover:bg-gray-700 hover:text-white px-3 py-2 rounded-md text-sm font-medium">Acceuil</a>
              <a href="#" class="text-gray-300 hover:bg-gray-700 hover:text-white px-3 py-2 rounded-md text-sm font-medium">Destinations</a>
              <a href="#" class="text-gray-300 hover:bg-gray-700 hover:text-white px-3 py-2 rounded-md text-sm font-medium">Offres</a>
              <a href="#" class="text-gray-300 hover:bg-gray-700 hover:text-white px-3 py-2 rounded-md text-sm font-medium">Contact</a>
            </div>
          </div>
        </div>
        <div class="mr-2 flex md:hidden">
          <button type="button" class="bg-white inline-flex items-center justify-center p-2 rounded-md hover:bg-white focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-800 focus:ring-white" aria-controls="mobile-menu" ariials aria-expanded="false" id="menu-button">
            <box-icon name='menu' class="h-6 w-6 menu-icon" id=""></box-icon>
            <box-icon name='x' class="h-6 w-6 close-icon hidden" id="" ></box-icon>
          </button>
        </div>

      </div>

    </div>
    <div class="md:hideen hidden" id="mobile-menu">
      <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
        <a href="" class="text-gray-300 hover:bg-gray-700 hover:text-white block px-3 py-2 rounded-md text-base font-medium">Acceuil</a>
        <a href="" class="text-gray-300 hover:bg-gray-700 hover:text-white block px-3 py-2 rounded-md text-base font-medium">Destinations</a>
        <a href="" class="text-gray-300 hover:bg-gray-700 hover:text-white block px-3 py-2 rounded-md text-base font-medium">Offres</a>
        <a href="" class="text-gray-300 hover:bg-gray-700 hover:text-white block px-3 py-2 rounded-md text-base font-medium">Contact</a>
      </div>
    </div>

  </nav>

  <!-- ############### -->
  <!-- Hero -->
  <!-- ############### -->

  <section class="relative h-screen flex justify-center items-center hero-bg bg-fixed bg-center bg-cover">
    <div class="absolute insert-0 bg-black opacity-50"></div>
    <div class="relative text-center p-6">
      <h1 class="text-4xl md:text-6xl font-bold mb-4 text-white">Découvrez le Monde avec Nous
      </h1>
      <p class="text-lg md:text-2xl mb-8 text-white">Voyagez vers les destinations de rêve avec des offres incroyables</p>
      <button class="bg-red-500 text-white px-6 py-3 rounded-full font-semibold animate-pulse">Réservez Maintenant </button>
    </div>
  </section>










  
  

<script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>
<script src="app.js"></script>
  
</body>
</html>
